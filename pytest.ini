[pytest]
testpaths = tests
markers =
    slow: needs the real KuaiRand-Pure dataset and/or minutes of CPU. Skipped
        unless RUN_SLOW_TESTS=1 and KUAIRAND_PATH points at the CSVs.
    llm: makes a real, billable OpenAI API call. Skipped unless
        RUN_LLM_TESTS=1 and OPENAI_API_KEY is set.
